services:
  booksaw-api:
    container_name: booksaw-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-1001}
    ports:
      - "${BOOKSAW_API_PORT:-1001}:${PORT:-1001}"
    volumes:
      - booksaw_uploads:/usr/src/booksaw-api/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT:-1001}/admin >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  booksaw_uploads:
